schema_version: "1.1"
name: dev-observability-context-quiet-logs
description: "Mid-task instruction in a small Express repo; handbook:dev-observability should fire or the handbook cache should be read."
tags: [dev-observability, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    the pino output is drowned by noisy logs from the HTTP client, quiet them down in the logger setup
context:
  scaffold_script: scaffold.sh
