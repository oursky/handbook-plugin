schema_version: "1.1"
name: dev-observability-indirect
description: "indirect phrasing; handbook:dev-observability should fire."
tags: [dev-observability]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    the logs are flooded with debug lines from some third-party http library and I can't see our own messages anymore
