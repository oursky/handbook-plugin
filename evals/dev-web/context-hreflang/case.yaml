schema_version: "1.1"
name: dev-web-context-hreflang
description: "Mid-task instruction in a small Express repo; handbook:dev-web should fire or the handbook cache should be read."
tags: [dev-web, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    add hreflang tags for en and zh-HK to the page head and sort out the URLs for each language
context:
  scaffold_script: scaffold.sh
