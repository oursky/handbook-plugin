schema_version: "1.1"
name: dev-security-indirect
description: "indirect phrasing; handbook:dev-security should fire."
tags: [dev-security]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    we're inheriting a client app nobody has touched in two years. how do we keep it from turning into a liability?
