schema_version: "1.1"
name: dev-development-indirect
description: "indirect phrasing; handbook:dev-development should fire."
tags: [dev-development]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    I want to deprecate the old /v1/orders endpoint without breaking the mobile clients still on it. how should I roll that out?
