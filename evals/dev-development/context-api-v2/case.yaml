schema_version: "1.1"
name: dev-development-context-api-v2
description: "Mid-task instruction in a small Express repo; handbook:dev-development should fire or the handbook cache should be read."
tags: [dev-development, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    add a v2 of the orders endpoint that returns a different shape, v1 clients must keep working
context:
  scaffold_script: scaffold.sh
