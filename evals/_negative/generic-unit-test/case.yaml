schema_version: "1.1"
name: _negative-generic-unit-test
description: "Generic coding prompt; no handbook skill should fire."
tags: [negative]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    write a jest test for a function add(a, b) that returns the sum
