schema_version: "1.1"
name: _negative-generic-bugfix
description: "Generic coding prompt; no handbook skill should fire."
tags: [negative]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    this TypeScript function returns undefined when the array is empty, find the bug: function first(xs: number[]) { for (const x of xs) { return x } }
