schema_version: "1.1"
name: dev-rationale-indirect
description: "indirect phrasing; handbook:dev-rationale should fire."
tags: [dev-rationale]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    reviewer says my code is hard to read. what's the standard we hold code to when someone opens it in five years?
