schema_version: "1.1"
name: dev-human-interface-context-button-padding
description: "Mid-task instruction in a small Express repo; handbook:dev-human-interface should fire or the handbook cache should be read."
tags: [dev-human-interface, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    the primary button on the signup page looks cramped, fix the padding and sizing
context:
  scaffold_script: scaffold.sh
