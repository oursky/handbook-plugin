schema_version: "1.1"
name: dev-git-indirect
description: "indirect phrasing; handbook:dev-git should fire."
tags: [dev-git]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    my feature branch is 40 commits behind main and has merge commits all over it. clean it up before I open the PR, what's the team's preferred way?
