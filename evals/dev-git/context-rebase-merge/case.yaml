schema_version: "1.1"
name: dev-git-context-rebase-merge
description: "Mid-task instruction in a small Express repo; handbook:dev-git should fire or the handbook cache should be read."
tags: [dev-git, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    always use rebase merge for PRs on this repo, update whatever needs it
context:
  scaffold_script: scaffold.sh
