schema_version: "1.1"
name: dev-git-task
description: "task phrasing; handbook:dev-git should fire."
tags: [dev-git]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    I forked the repo to push my changes. set up the remotes the way we normally name them
