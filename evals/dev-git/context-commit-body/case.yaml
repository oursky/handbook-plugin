schema_version: "1.1"
name: dev-git-context-commit-body
description: "Mid-task instruction in a small Express repo; handbook:dev-git should fire or the handbook cache should be read."
tags: [dev-git, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    drop the body from the last commit message, keep just the subject line
context:
  scaffold_script: scaffold.sh
