schema_version: "1.1"
name: dev-documentation-context-user-journey
description: "Mid-task instruction in a small Express repo; handbook:dev-documentation should fire or the handbook cache should be read."
tags: [dev-documentation, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    write up the user journey for looking up an order, put it where docs go in this repo
context:
  scaffold_script: scaffold.sh
