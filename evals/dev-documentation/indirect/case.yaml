schema_version: "1.1"
name: dev-documentation-indirect
description: "indirect phrasing; handbook:dev-documentation should fire."
tags: [dev-documentation]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    I've got a pile of notes an AI agent wrote while working on this repo. where do those go so they don't clutter the real docs?
