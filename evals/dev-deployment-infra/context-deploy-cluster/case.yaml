schema_version: "1.1"
name: dev-deployment-infra-context-deploy-cluster
description: "Mid-task instruction in a small Express repo; handbook:dev-deployment-infra should fire or the handbook cache should be read."
tags: [dev-deployment-infra, context]
runs: 3
execution:
  model: sonnet
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: >-
    deploy this service to the cluster, write whatever manifests it needs
context:
  scaffold_script: scaffold.sh
