schema_version: "1.1"
name: dev-deployment-infra-indirect
description: "indirect phrasing; handbook:dev-deployment-infra should fire."
tags: [dev-deployment-infra]
runs: 3
execution:
  model: sonnet
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    our uploads bucket on RustFS is rejecting browser PUTs from the web app with a CORS error. what do I change?
